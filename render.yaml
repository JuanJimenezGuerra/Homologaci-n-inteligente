services:
  - type: web
    name: shr-api-prod
    plan: starter
    region: oregon
    envVars:
      - key: SECRET_KEY
        value: SHR-Prod-Secret-2026-Homologacion-Inteligente
      - key: DATABASE_URL
        value: postgresql://postgres.mttizxynbskldwoxznva:shr2026SHR2020@aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: BACKEND_URL
        value: https://shr-backend-prod.onrender.com
  
  # Cron-job 1: Ping cada minuto (Render free tier se duerme tras 50s sin tráfico)
  - type: cron
    name: shr-api-keepalive-1m
    schedule: '*/1 * * * *'  # Cada minuto
    envVars:
      - key: CRON_COMMAND
        value: curl -s https://shr-backend-prod.onrender.com/ping || true

  # Cron-job 2: Segundo ping con delay para cubrir el gap de 30s
  - type: cron
    name: shr-api-keepalive-30s
    schedule: '*/1 * * * *'  # Cada minuto
    envVars:
      - key: CRON_COMMAND
        value: sleep 30 && curl -s https://shr-backend-prod.onrender.com/ping || true
