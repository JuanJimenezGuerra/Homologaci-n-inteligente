services:
  - type: web
    name: shr-api-prod
    plan: starter
    region: oregon
    envVars:
      - key: SECRET_KEY
        value: SHR-Prod-Secret-2026-Homologacion-Inteligente
      - key: DATABASE_URL
        fromDatabase:
          name: shr-homologacion-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
